name: Publish site

# Three ways to rebuild:
#   workflow_dispatch — the "Run workflow" button in the Actions tab (use this
#                       after editing Notion; ~1-2 min)
#   push             — any commit to main
#   schedule         — a safety net. GitHub queues cron jobs, so "hourly"
#                      realistically means "within an hour or so".
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build guide content from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: 3c9bc34c2ab28117980dcba94f79a6a5
        run: node build-content.mjs

      - name: Build roster from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: 32b9edf5a84b4ca3af236801c9f0ecdb
          BOOKED_STATUS: Booked
        run: node build-roster.mjs

      # Publish only what the site needs — not the build scripts.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html content.json _site/
          [ -f invited.json ] && cp invited.json _site/ || true
          [ -f roster.json ] && cp roster.json _site/ || true
          [ -d assets ] && cp -r assets _site/ || true
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
